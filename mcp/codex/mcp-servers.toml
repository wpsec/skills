# Codex MCP 服务器配置
# 摘录自 ~/.codex/config.toml 的 [mcp_servers] 段
# 还原方式:将本文件内容合并到 ~/.codex/config.toml 的 [mcp_servers] 下

# 安装前提
#   codegraph:    npm install -g @colbymchenry/codegraph
#                 来源 https://github.com/colbymchenry/codegraph
#   sequential-thinking: 需要 Node.js 24+ + npx,当前固定 npm 包 2.1.1

[mcp_servers.codegraph]
type = "stdio"
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.codegraph.tools.codegraph_explore]
approval_mode = "approve"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@2.1.1"]
